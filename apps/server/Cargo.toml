[package]
name = "rproxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal high-performance reverse proxy"
license = "GPL-3.0"

[dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# HTTP server and client
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["full", "tokio"] }
http-body-util = "0.1.3"
http = "1.4.0"
bytes = "1.11.0"

# Middleware
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.8", features = [
    "compression-br",
    "compression-gzip",
    "decompression-br",
    "decompression-gzip",
] }

# TLS with ACME (Let's Encrypt)
tokio-rustls = "0.26.4"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1.3"
tokio-rustls-acme = "0.9.0"
tokio-stream = { version = "0.1.18", features = ["net"] }

# WebSocket
tokio-tungstenite = "0.28.0"

# Rate limiting
governor = "0.10.4"

# Cache
moka = { version = "0.12.13", features = ["future"] }

# Async utils
futures-util = "0.3.31"

# Utils
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
globset = "0.4.18"

[dev-dependencies]
# Test framework
rstest = "0.26.1"
serial_test = "3.3.1"
tokio-test = "0.4.5"
pretty_assertions = "1.4.1"
tempfile = "3.24.0"

# HTTP client for integration tests
reqwest = { version = "0.13.1", features = ["json"] }

# Test server
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
