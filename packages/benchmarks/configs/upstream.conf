# Upstream server configuration (simulates backend application)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Disable logging for benchmarks
    access_log off;
    error_log /dev/null crit;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Buffers
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Root endpoint
        location / {
            return 200 'Hello from upstream server';
            add_header Content-Type text/plain;
        }

        # API simulation endpoints
        location /api/ {
            return 200 '{"status":"ok","timestamp":$msec}';
            add_header Content-Type application/json;
        }

        location /api/users {
            return 200 '{"users":[{"id":1,"name":"Alice"},{"id":2,"name":"Bob"}]}';
            add_header Content-Type application/json;
        }

        location /api/products {
            return 200 '{"products":[{"id":1,"name":"Widget","price":9.99}]}';
            add_header Content-Type application/json;
        }

        location /api/orders {
            return 200 '{"orders":[{"id":1,"total":99.99,"status":"completed"}]}';
            add_header Content-Type application/json;
        }

        location /api/search {
            return 200 '{"results":[],"total":0}';
            add_header Content-Type application/json;
        }

        # Static assets simulation
        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /_next/static/ {
            return 200 'console.log("next.js bundle");';
            add_header Content-Type application/javascript;
        }

        # Large response simulation
        location /api/large {
            return 200 '{"data":"$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id"}';
            add_header Content-Type application/json;
        }

        # Slow endpoint (for timeout testing)
        # Note: Actual delay would require lua or echo module
        location /api/slow {
            return 200 '{"status":"slow_response"}';
            add_header Content-Type application/json;
        }
    }
}
