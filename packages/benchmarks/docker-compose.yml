# Benchmark environment for comparing reverse proxies
# All proxies run with identical resource limits

services:
  # Simple upstream server (responds with static content)
  upstream:
    container_name: bench-upstream
    image: nginx:alpine
    volumes:
      - ./configs/upstream.conf:/etc/nginx/nginx.conf:ro
      - ./configs/upstream-content:/usr/share/nginx/html:ro
    networks:
      - bench-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # rproxy (our Rust proxy)
  rproxy:
    container_name: bench-rproxy
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    environment:
      - RPROXY_LISTEN=0.0.0.0:8080
      - RPROXY_UPSTREAM=upstream:80
      - RPROXY_TLS_DOMAINS=
      - RPROXY_RATE_LIMIT=100000
      - RPROXY_RATE_BURST=200000
      - RPROXY_LOG_LEVEL=warn
      - RPROXY_CACHE_ENABLED=false
      - RPROXY_HSTS=false
    ports:
      - "8080:8080"
    networks:
      - bench-network
    depends_on:
      upstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # nginx
  nginx:
    container_name: bench-nginx
    image: nginx:alpine
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
    networks:
      - bench-network
    depends_on:
      upstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # traefik
  traefik:
    container_name: bench-traefik
    image: traefik:v3.2
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:8082"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=WARN"
      - "--accesslog=false"
    volumes:
      - ./configs/traefik.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "8082:8082"
    networks:
      - bench-network
    depends_on:
      upstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # caddy
  caddy:
    container_name: bench-caddy
    image: caddy:alpine
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8083:8083"
    networks:
      - bench-network
    depends_on:
      upstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # envoy
  envoy:
    container_name: bench-envoy
    image: envoyproxy/envoy:v1.32-latest
    volumes:
      - ./configs/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8084:8084"
    networks:
      - bench-network
    depends_on:
      upstream:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  bench-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
